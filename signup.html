<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="css/signup.css">
    </head>
    <body class="auth">
        <div class="signup">
            <div class="logo">
                    <h2>Sign Up</h2>
            </div>
            <form class="auth-form">
                <div class="auth-container">
                    <div class="input-container">
                        <input class="input-text" type="text" placeholder="Name" required> 
                        <input class="input-text" type="text" placeholder="Email address" required> 
                        <input class="input-text" type="text" placeholder="Country" required> 
                        <input class="input-text" type="tel" placeholder="Phone" required> 
                        <input class="input-text type="password" placeholder="Password" required> 
                    </div>
                    <div class="checkbox">
                        <input type="checkbox"> <p></p>I agree to terms and conditions</p>
                    </div>
                    <div class="btn-container">
                        <button class="btn" type="submit">Create account</button>
                    </div>
                    <div class="p-container">
                         <p  class="text">If you already have an account? <a class="sign-in" href="#">Sign in</a></p>
                    </div>
                </div>
            </form>
        </div>
    </body>
</html>
